name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Validate HTML
        run: npx --yes html-validate@11.6.2 "*.html" "case-studies/**/*.html"

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/case-studies.js
          node --check assets/js/repositories.js
          node --check assets/js/scrollspy.js

      - name: Check links and referenced assets
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # LinkedIn blocks automated link checkers, causing false CI failures.
          args: >-
            --root-dir "${{ github.workspace }}"
            --verbose
            --no-progress
            --exclude-loopback
            --accept 200,204,206,429
            --exclude "^https://www\.linkedin\.com/"
            "./**/*.md"
            "./**/*.html"
          fail: true
          failIfEmpty: true
